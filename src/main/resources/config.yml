############################################################
# +------------------------------------------------------+ #
# |                     Settings                         | #
# +------------------------------------------------------+ #
############################################################

settings:
  commands:
    # set custom aliases for /tags
    # ** adding/removing these aliases require a restart to take effect! **
    main-command: 'tags'
    aliases:
      - tag
  no-permission-menu-action: true # set true, if the player doesn't have permission to the argument like "/tags reload" it will just open the tags' menu.
  proxy-file-syncing: false # syncs tag files across all proxy servers when tags are created, edited, deleted, or reloaded.
  db-only-tags: false # stores global tags in the configured database instead of tags/*.yml files. Recommended for multi-server MySQL/MariaDB setups.
  db-tags-refresh-interval: 5 # seconds between automatic database tag refreshes when db-only-tags is enabled.
  default-tag: 'none' # set 'none' players start with no tag.
  forced-tag: false # this will make it force players to have a tag, they won't beable to take the tag off.
  categories: false # should supremetags use the category system?
  default-category: 'default' # used to set the tags category value when creating a new tag with the '/tag create' command
  default-tag-file: 'countries.yml' # used to set the default file location when creating a new tag with the '/tags create' command
  update-check: true # the plugin will check if there is an update available.
  auto-merge: false # auto merges all tags from deluxetags into supremetags (DeluxeTags is required on the server)
  active-tag-glow: true # adds a hidden enchantment to the tag item that is active for the player.
  tag-command-in-disabled-worlds: true # should /tags command be disabled in 'disabled-worlds'.
  disabled-worlds: # what worlds should tags be allowed in, tags in this world will not be shown.
    - 'example'
    - 'world2'
  cost-system: false # set true if tags should require an economy cost to unlock.
  use-global-lore: false # set true if tags should use global tag lore settings.
  auto-apply:
    displayname: true # automatically apply the selected tag to the player's display name.
    tab: true # automatically apply the selected tag to the player's tab list name.
    displayname-format: '%displayname% %tag%'
    tab-format: '%playerlistname% %tag%'
  gui-messages: true # setting this to true, will enable 'tag-select-message' & 'reset-message'
  locked-view: true # this setting allows players to view locked/unlocked tags.
  personal-tags:
    enable: true # this setting allows players to make and access their own tags.
    use-creation-dialogs: true # 1.21.8+ ONLY!
    credits:
      enable: true # built-in personal tag currency used to create personal tags.
      starting-balance: 0
      creation-cost: 10
      how-to-earn:
        - '<reset><gray>You can earn Tag Credits from server rewards.'
        - '<reset><gray>Common earning methods:'
        - '<reset><dark_gray>• <reset><white>Vote rewards'
        - '<reset><dark_gray>• <reset><white>Crates'
        - '<reset><dark_gray>• <reset><white>Events'
        - '<reset><dark_gray>• <reset><white>Playtime rewards'
    limits:
      # permission limits: supremetags.mytags.limit.\<group>
      ## example: supremetags.mytags.limit.default
      default: 10
      ## example: supremetags.mytags.limit.vip
      vip: 20
    format-replace: '%tag%' # strict format replacer.
    create-requirements:
      # Supported time formats: m = minutes, hr = hours, d = days. Set to 0m to disable a requirement.
      min-server-age: 0m # examples: 1m, 1hr or 1d
      min-playtime: 2hr # examples: 2m, 2hr or 2d
  # layout types: [FULL, BORDER]
  # FULL - 36 tags
  # BORDER - 28 tags
  layout-type: 'BORDER'
  animated-tag-speed: 10 # in ticks
  tag-vouchers: true # should tag vouchers withdraw be enabled?
  prioritise-selected-tag: true # set false if you don't want selected tag to force at first slot.
  voucher-redeem-permission: true # set false if you don't want permission 'supremetags.voucher.[identifier]' applying to tag vouchers.
  voucher-redeem-confirmation: true # set false if you don't want players to confirm before redeeming tag vouchers.
  tag-purchase-confirmation: true # set false if you don't want players to confirm before purchasing cost tags.
  tag-select-confirmation: false # set false if you don't want players to confirm before selecting tags.
  deactivate-click: true # set false if you don't want function where if you click the active tag item in gui, it will deactivate.
  only-show-player-access-tags: false # if true, the tag menus will only show the tags that the player has access to.
  search-type: 'DIALOG' # either 'SIGN', 'ANVIL' or 'DIALOG'(1.21.8+ ONLY!)
  update-unlocked-cache: 300 # time in seconds (300 = 5 mins)

statistics:
  enabled: true # tracks tag selections, unique users, active users and per-player usage in statistics.yml.

############################################################
# +------------------------------------------------------+ #
# |                   Placeholders                       | #
# +------------------------------------------------------+ #
############################################################

placeholders:
  # %supremetags_tag%
  # Supported aliases: {tag} / {TAG} / {supremetags_tag}
  tag:
    none-output: ''
    format: '%tag%'
    # Output mode: minimessage
    # SupremeTags configs use MiniMessage formatting exclusively.
    output: 'minimessage'
  # %supremetags_chattag%
  # is used for other built in placeholders as well.
  chat:
    none-output: ''
    format: '%tag%'
    # Output mode: minimessage
    # SupremeTags configs use MiniMessage formatting exclusively.
    output: 'minimessage'
  # %supremetags_scorebardtag%
  scoreboard:
    none-output: ''
    format: '%tag%'
    # Output mode: minimessage
    output: 'minimessage'
  # %supremetags_tabtag%
  tab:
    none-output: ''
    format: '%tag%'
    # Output mode: minimessage
    output: 'minimessage'

############################################################
# +------------------------------------------------------+ #
# |                       Sounds                         | #
# +------------------------------------------------------+ #
############################################################
# These default generated sounds use modern Bukkit names:
# https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
#
# Google search: "spigot sounds \<version>".

sounds:
  open-menus:
    enable: true
    sound: 'item.book.page_turn'
    volume: 1.0
    pitch: 1.0
  selected-tag:
    enable: true
    sound: 'entity.player.levelup'
    volume: 0.6
    pitch: 1.2
  reset-tag:
    enable: true
    sound: 'block.composter.fill_success'
    volume: 0.9
    pitch: 1.0
  error-message:
    enable: true
    sound: 'entity.villager.no'
    volume: 1.0
    pitch: 0.9
  favourite-added:
    enable: true
    sound: 'entity.player.levelup'
    volume: 0.6
    pitch: 1.2
  favourite-removed:
    enable: true
    sound: 'block.composter.fill_success'
    volume: 0.9
    pitch: 1.0

editor:
  frontend-url: 'https://supremetags.net/editor/'
  api-url: 'https://supremetags-editor-api.noscapedev.workers.dev'
  latest-version-fallback: '3.0.0'
  session-expire-minutes: 1440
