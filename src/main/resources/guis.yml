############################################################
# +------------------------------------------------------+ #
# |                       Gui                            | #
# +------------------------------------------------------+ #
############################################################
# In 2.0.10 comes multi slots for any custom items in the gui, you can follow the format below.
# - by simply changing "slot" to "slots", now you will be able to do a number list;
# slots:
#   - 1
#   - 2
#   - 30

gui:
  main-menu:
    title: '<bold>Categories'
    size: 27
    tag-slots:
      # Display specific tags directly in the main menu.
      enable: true
      tags:
        example1:
          identifier: santa
          slot: 21
        example2:
          identifier: mega
          slot: 22
        example3:
          identifier: ultra
          slot: 23
    custom-items:
      all-tags:
        enable: true
        slot: 4
        displayname: '<reset><aqua>All Tags'
        material: 'BOOK'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>Chat Tags'
          - ''
          - '<reset><gray>Click to browse every tag.'
        click-commands:
          - '[all-tags]'
      info:
        enable: false
        slot: 3
        displayname: '<reset><green>What are Tags?'
        material: 'BOOK'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>Chat Tags'
          - ''
          - '<reset><gray>Tags are basically like prefix''s'
          - '<reset><gray>and they can be display in chat/tab.'
          - ''
          - '<reset><gray>Select a category below to see our amazing'
          - '<reset><gray>tags.'
        click-commands: []
      close:
        enable: true
        slot: 26
        displayname: '<reset><red>Close'
        material: 'RED_BED'
        custom-model-data: 0
        lore:
          - '<reset><gray>Click to close the menu!'
        click-commands:
          - '[close]'
      border:
        enable: true
        slots:
          - 0
          - 1
          - 2
          - 3
          - 5
          - 6
          - 7
          - 8
          - 9
          - 17
          - 18
          - 19
          - 20
          - 21
          - 22
          - 23
          - 24
          - 25
        displayname: '<reset><red>'
        material: 'GRAY_STAINED_GLASS_PANE'
        custom-model-data: 0
        lore: []
        click-commands: []
  personal-tags:
    title: '<bold>Personal Tags'
    items:
      no-tags-item:
        enable: true
        slot: 22
        material: 'ANVIL'
        custom-model-data: 0
        displayname: '<reset><red>You don''t have any personal tags!'
        lore:
          - '<reset><gray>Click on the <bold>Create a Tag <reset><gray>Item to create a tag'
  personal-tags-hub:
    title: '<bold>Personal Tags Hub'
    size: 27
    items:
      your-tags:
        enable: true
        slot: 11
        material: 'NAME_TAG'
        custom-model-data: 0
        displayname: '<reset><aqua><bold>Your Tags'
        lore:
          - '<reset><gray>Create, select, and edit your personal tags.'
          - '<reset><gray>Creation Cost: <reset><yellow>%tag_credits_creation_cost% Credits'
      browse-tags:
        enable: true
        slot: 13
        material: 'BOOK'
        custom-model-data: 0
        displayname: '<reset><light_purple><bold>Browse Tags'
        lore:
          - '<reset><gray>View personal tags created by players.'
      credits:
        enable: true
        slot: 15
        material: 'SUNFLOWER'
        custom-model-data: 0
        displayname: '<reset><yellow><bold>Tag Credits'
        lore:
          - '<reset><gray>Balance: <reset><yellow>%tag_credits%'
          - '<reset><gray>Used to create personal tags.'
      back:
        enable: true
        slot: 18
        material: 'ARROW'
        custom-model-data: 0
        displayname: '<reset><white><bold>Back'
        lore:
          - '<reset><gray>Go back to the tags menu.'
      close:
        enable: true
        slot: 26
        material: 'BARRIER'
        custom-model-data: 0
        displayname: '<reset><red><bold>Close'
        lore:
          - '<reset><gray>Close the menu.'
  personal-tags-browser:
    title: '<bold>Browse Personal Tags <reset><dark_gray>(%page%/%max_pages%)'
    size: 54
    tags-per-page: 28
    slots-tag:
      enable: false
      slots:
        - 10
        - 11
        - 12
        - 13
        - 14
        - 15
        - 16
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
        - 37
        - 38
        - 39
        - 40
        - 41
        - 42
        - 43
    tag-item:
      displayname: '<reset><gray>%player% <reset><dark_gray>➜ %tag%'
      lore:
        - '<reset><dark_gray>Personal Tag'
        - ''
        - '<reset><gray>Owner: <reset><white>%player%'
        - '<reset><gray>Tag: <reset><white>%tag%'
    items:
      no-tags-item:
        enable: true
        slot: 22
        material: 'ANVIL'
        custom-model-data: 0
        displayname: '<reset><red>No personal tags found!'
        lore:
          - '<reset><gray>No players have created personal tags yet.'
      back:
        enable: true
        slot: 48
        material: 'ARROW'
        custom-model-data: 0
        displayname: '<reset><white><bold>Back'
        lore:
          - '<reset><gray>Go back to the personal tags hub.'
      close:
        enable: true
        slot: 49
        material: 'BARRIER'
        custom-model-data: 0
        displayname: '<reset><red><bold>Close'
        lore:
          - '<reset><gray>Close the menu.'
      next:
        enable: true
        slot: 50
        material: 'ARROW'
        custom-model-data: 0
        displayname: '<reset><white><bold>Next'
        lore:
          - '<reset><gray>Go to the next page.'
  personal-tags-editor:
    title: '<reset><dark_gray>Tag Editor > %identifier%'
    size: 27
  tag-menu:
    title: '<bold>Tags <reset><dark_gray>(%page%/%max_pages%)'
    size: 54
    tags-per-page: 28
    items:
      no-tags-item:
        enable: true
        slot: 22
        material: 'ANVIL'
        custom-model-data: 0
        displayname: '<reset><red>There are no tags loaded!'
        lore:
          - '<reset><gray>No server tags have been loaded or added yet.'
    slots-tag:
      # set true to control how you want to layout tags.
      enable: false
      # These will be the slots that tags will be assigned to each page.
      # 1. In this example there are 14 slots, this means you need to put 'tags-per-page' above to 14.
      # 2. if false, tags will start at the first empty slot by default.
      slots:
        - 19 # starting slot
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34 # ending slot
    global-locked-tag:
      displayname: '<reset><gray>Tag: %tag%'
      display-item: BARRIER
      custom-model-data: 0
    global-tag-lores:
      unlocked-lore:
        - '%description%'
        - ''
        - '<reset><gray>Tag <reset><dark_gray>➜ %tag%'
        - '<reset><gray>Variants <reset><dark_gray>➜ <reset><yellow>%variants%'
        - '<reset><gray>Preview <reset><dark_gray>➜ <reset><white>%player_name% %tag%<reset><dark_gray>: <reset><white>Hi'
        - '<reset><gray>Unlocked <reset><dark_gray>➜ <reset><white>%track_unlocked%'
        - '<reset><gray>Rarity: <reset><dark_gray>➜ %rarity%'
        - '<reset><gray>Effects <reset><dark_gray>➜'
        - '<reset><gray>%effects%'
        - ''
        - '<reset><yellow><underlined>Click to Assign'
      # used for selected tag view
      selected-lore:
        - '%description%'
        - ''
        - '<reset><gray>Tag <reset><dark_gray>➜ %tag%'
        - '<reset><gray>Variants <reset><dark_gray>➜ <reset><yellow>%variants%'
        - '<reset><gray>Preview <reset><dark_gray>➜ <reset><white>%player_name% %tag%<reset><dark_gray>: <reset><white>Hi'
        - '<reset><gray>Unlocked <reset><dark_gray>➜ <reset><white>%track_unlocked%'
        - '<reset><gray>Rarity: <reset><dark_gray>➜ %rarity%'
        - '<reset><gray>Effects <reset><dark_gray>➜'
        - '<reset><gray>%effects%'
        - ''
        - '<reset><green><underlined>This tag is selected!'
      # used for cost lores that are locked
      locked-lore:
        - '%description%'
        - ''
        - '<reset><gray>Buy <reset><dark_gray>➜ <reset><white>Right-Click'
        - '<reset><gray>Cost <reset><dark_gray>➜ <reset><white>$%cost%'
        - ''
        - '<reset><red><underlined>This tag is locked'
      # used for when 'locked-view' is enabled and players doesn't have permission
      locked-permission:
        - '%description%'
        - ''
        - '<reset><gray>Preview <reset><dark_gray>➜ <reset><white>%player_name% %tag%<reset><dark_gray>: <reset><white>Hi'
        - ''
        - '<reset><red><underlined>Requirements'
        - '%requirements%'
        - ''
        - '<reset><red><underlined>This tag is locked'
    custom-items:
      balance:
        enable: true
        slot: 0
        displayname: '<reset><gray>Balance <reset><green>$%vault_eco_balance%'
        material: 'EMERALD'
        custom-model-data: 0
        hide-tooltip: false # 1.21.5+ only
        click-commands:
          - '[message] <reset><gray>Balance: <reset><green>$%vault_eco_balance%'
          #- '[player] balance'
          #- '[console] eco give %player% 100'
  confirmation-menu:
    title: 'Confirm Action'
    size: 27
    items:
      accept:
        material: 'LIME_STAINED_GLASS_PANE'
        displayname: '<reset><green><bold>CONFIRM'
        slots:
          - 0
          - 1
          - 2
          - 9
          - 10
          - 11
          - 18
          - 19
          - 20
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>%action%'
          - ''
          - '<reset><gray>You are about to confirm:'
          - '<reset><white>%target%'
          - ''
          - '<reset><gray>Tag: <reset><yellow>%tag%'
          - '<reset><gray>Identifier: <reset><yellow>%identifier%'
          - '<reset><gray>Cost: <reset><green>%cost%'
          - ''
          - '<reset><green><underlined>Click to confirm'
        hide-tooltip: false # 1.21.5+ only
      divider:
        material: 'BLACK_STAINED_GLASS_PANE'
        displayname: '<reset><dark_gray>'
        slots:
          - 4
          - 13
          - 22
        custom-model-data: 0
        lore: []
        hide-tooltip: true # 1.21.5+ only
      deny:
        material: 'RED_STAINED_GLASS_PANE'
        displayname: '<reset><red><bold>CANCEL'
        slots:
          - 6
          - 7
          - 8
          - 15
          - 16
          - 17
          - 24
          - 25
          - 26
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>%action%'
          - ''
          - '<reset><gray>You are about to cancel:'
          - '<reset><white>%target%'
          - ''
          - '<reset><gray>Tag: <reset><yellow>%tag%'
          - '<reset><gray>Identifier: <reset><yellow>%identifier%'
          - '<reset><gray>Cost: <reset><green>%cost%'
          - ''
          - '<reset><red><underlined>Click to cancel'
        hide-tooltip: false # 1.21.5+ only
  # Each action is auto synced, meaning they are hidden depending on the tag permissions/cost/active options.
  # Don't change the item names as this will remove functionality.
  tag-actions-menu:
    enable: false # if false, the system will use its default click to active tag function.
    title: '<bold>Tag Actions'
    size: 27
    functions:
      # withdraw-tag - withdraw
      # this item will show rather than editor-tag if the player doesn't have permission.
      withdraw-tag:
        enable: true
        slot: 11
        display-item: 'NAME_TAG'
        displayname: '<reset><gray>Withdraw %tag%'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>Withdraw'
          - ''
          - '<reset><green><underlined>Click to withdraw this tag'
        hide-tooltip: false # 1.21.5+ only
      # editor-tag - send you to the tag editor
      editor-tag:
        enable: true
        slot: 11
        permission-required: true # requires supremetags.admin
        display-item: 'NAME_TAG'
        displayname: '<reset><gray>Edit %tag%'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>Edit Tag'
          - ''
          - '<reset><green><underlined>Click to edit this tag'
        hide-tooltip: false # 1.21.5+ only
      # assigns-tag - equips the tag.
      assign-tag:
        enable: true
        slot: 15
        display-item: 'NAME_TAG'
        displayname: '<reset><gray>Assign %tag%'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>Assign Tag'
          - ''
          - '<reset><green><underlined>Click to assign this tag'
        hide-tooltip: false # 1.21.5+ only
      # purchase-tag - buys the tag if it's a cost-tag.
      purchase-tag:
        enable: true
        slot: 15
        display-item: 'NAME_TAG'
        displayname: '<reset><gray>Purchase %tag%'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>Purchase Tag'
          - ''
          - '<reset><green><underlined>Click to purchase this tag'
        hide-tooltip: false # 1.21.5+ only
      # unassign-tag - resets the activated tag to none.
      unassign-tag:
        enable: true
        slot: 15
        display-item: 'RED_DYE'
        displayname: '<reset><gray>Reset %tag%'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>UnAssign Tag'
          - ''
          - '<reset><green><underlined>Click to reset this tag'
        hide-tooltip: false # 1.21.5+ only
      # variants - Opens variants Menu for the tag.
      variants:
        enable: true
        hide-when-zero: true # If true, the plugin will hide the item when the tags has 0 variants.
        slot: 13
        display-item: 'LIME_DYE'
        displayname: '<reset><gray>Variants'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>Variants'
          - ''
          - '<reset><green><underlined>Click to view variants'
        hide-tooltip: false # 1.21.5+ only
      back:
        enable: true
        slot: 18
        display-item: 'RED_BED'
        displayname: '<reset><red><bold>Go Back'
        custom-model-data: 0
        lore:
          - '<reset><dark_gray>Back Button'
          - ''
          - '<reset><green><underlined>Click to go back to tags menu'
        hide-tooltip: false # 1.21.5+ only
  tag-variants-menu:
    title: '<reset><dark_gray>%identifier%''s Variants <reset><dark_gray>(%page%/%max_pages%)'
    size: 54
    items:
      no-tags-item:
        enable: true
        slot: 22
        material: 'ANVIL'
        custom-model-data: 0
        displayname: '<reset><red>There are no variants!'
        lore:
          - '<reset><gray>This tag does not have any variants yet.'
    item:
      display-item: 'NAME_TAG'
      displayname: '<reset><gray>Variant: %tag%'
      custom-model-data: 0
      lore:
        unlocked-lore:
          - '%description%'
          - ''
          - '<reset><gray>Tag <reset><dark_gray>➜ %tag%'
          - '<reset><gray>Preview <reset><dark_gray>➜ <reset><white>%player_name% %tag%<reset><dark_gray>: <reset><white>Hi'
          - ''
          - '<reset><yellow><underlined>Click to Assign'
        selected-lore:
          - '%description%'
          - ''
          - '<reset><gray>Tag <reset><dark_gray>➜ %tag%'
          - '<reset><gray>Preview <reset><dark_gray>➜ <reset><white>%player_name% %tag%<reset><dark_gray>: <reset><white>Hi'
          - ''
          - '<reset><green><underlined>This tag is selected!'
        locked-permission:
          - '%description%'
          - ''
          - '<reset><gray>Tag <reset><dark_gray>➜ %tag%'
          - '<reset><gray>Preview <reset><dark_gray>➜ <reset><white>%player_name% %tag%<reset><dark_gray>: <reset><white>Hi'
          - ''
          - '<reset><gray><italic>No permission to select this variant!'
          - ''
          - '<reset><red><underlined>This tag is locked'
  search-menu:
    items:
      no-tags-item:
        enable: true
        slot: 22
        material: 'ANVIL'
        custom-model-data: 0
        displayname: '<reset><red>No tags matched your search!'
        lore:
          - '<reset><gray>Try searching for a different tag or category.'
  tag-editor-menu:
    title: '<bold>Tag Editor'
    specific-tag-editor-title: '<reset><gray>Tag ➟ [%identifier%]'
    tag-item:
      displayname: '<reset><gray>Tag: %tag%'
      lore:
        - '<reset><gray><strikethrough>-----------------------------'
        - ''
        - '<reset><aqua>Identifier: <reset><gray>%identifier%'
        - ''
        - '<reset><light_purple>Description:'
        - '<reset><gray>%description%'
        - ''
        - '<reset><yellow>Click to Edit!'
        - '<reset><gray><strikethrough>-----------------------------'

    ####### change
    editor-items:
      change-tag: '<reset><yellow><bold>Change Tag'
      change-description: '<reset><yellow><bold>Change Description'
      change-permission: '<reset><yellow><bold>Change Permission'
      change-category: '<reset><yellow><bold>Change Category'
      delete-tag: '<reset><red><bold>Delete Tag'
  category-editor-menu:
    title: '<bold>Category Editor'
    specific-category-editor-title: '<reset><gray>Category ➟ [%identifier%]'
    categories-per-page: 28
    slots-category:
      enable: false
      slots:
        - 19
        - 20
        - 21
        - 22
        - 23
        - 24
        - 25
        - 28
        - 29
        - 30
        - 31
        - 32
        - 33
        - 34
    editor-items:
      change-displayname: '<reset><yellow><bold>Change Display Name'
      change-identifier: '<reset><yellow><bold>Change Identifier'
      change-description: '<reset><yellow><bold>Change Description'
      change-material: '<reset><yellow><bold>Change Material'
      change-slot: '<reset><yellow><bold>Change Slot'
      change-permission: '<reset><yellow><bold>Change Permission'
      change-permission-see-category: '<reset><yellow><bold>Change Permission See Category'
      change-cost-category: '<reset><yellow><bold>Change Cost Category'
      change-glow: '<reset><yellow><bold>Change Glow'
      delete-category: '<reset><red><bold>Delete Category'
  # disable items in the gui.
  # setting these values to false will not display the item in tag gui.
  items:
    ## WARNING ##
    # these default items names can't be changed!
    # but you can make new displayable static items.
    close:
      enable: true
      slot: 49
      displayname: '<reset><red><bold>Close'
      material: 'BARRIER'
      custom-model-data: 0
      lore:
        - '<reset><gray>Close the Menu!'
      hide-tooltip: false # 1.21.5+ only
    reset:
      enable: true
      slot: 46
      displayname: '<reset><red><bold>Reset Tag'
      material: 'RED_DYE'
      custom-model-data: 0
      lore: []
      hide-tooltip: false # 1.21.5+ only
    glass: # this will only be disabled for 'FULL' layout type.
      enable: true
      displayname: '<reset><red>'
      material: 'GRAY_STAINED_GLASS_PANE'
      custom-model-data: 0
      hide-tooltip: true # 1.21.5+ only
    personal-tags:
      enable: true
      slot: 8
      displayname: '<reset><aqua><bold>Personal Tags'
      material: 'ENDER_PEARL'
      custom-model-data: 0
      lore:
        - '<reset><gray>Create your own tags!'
      hide-tooltip: false # 1.21.5+ only
    # create tag is for personal tags menu
    create-tag:
      enable: true
      slot: 53
      displayname: '<reset><aqua><bold>Create a Tag'
      material: 'ENDER_PEARL'
      custom-model-data: 0
      lore:
        - '<reset><gray>Create a new tag!'
        - '<reset><gray>Cost: <reset><yellow>%tag_credits_creation_cost% Tag Credits'
        - '<reset><gray>Your Credits: <reset><yellow>%tag_credits%'
      hide-tooltip: false # 1.21.5+ only
    tag-credits:
      enable: true
      slot: 47
      displayname: '<reset><yellow><bold>Tag Credits'
      material: 'SUNFLOWER'
      custom-model-data: 0
      lore:
        - '<reset><gray>Balance: <reset><yellow>%tag_credits%'
        - '<reset><gray>Used to create personal tags.'
      hide-tooltip: false # 1.21.5+ only
    tag-credits-help:
      enable: true
      slot: 51
      displayname: '<reset><yellow><bold>How to earn Tag Credits'
      material: 'BOOK'
      custom-model-data: 0
      lore:
        - '<reset><gray>Click to learn how to earn credits.'
      hide-tooltip: false # 1.21.5+ only
    active:
      enable: true
      slot: 52
      displayname: '<reset><gold><bold>%player%'
      material: 'NAME_TAG'
      custom-model-data: 0
      lore:
        - '<reset><gray>Your Active Tag: <reset><gold>%identifier%'
      hide-tooltip: false # 1.21.5+ only
    favourites:
      enable: true
      slot: 4
      displayname: '<reset><gold><bold>Favourites'
      material: 'YELLOW_DYE'
      custom-model-data: 0
      lore:
        - '<reset><gray>View your favourite tags!'
      hide-tooltip: false # 1.21.5+ only
    next:
      enable: true
      slot: 50
      displayname: '<reset><white><bold>Next'
      material: 'ARROW'
      custom-model-data: 0
      lore:
        - '<reset><gray>Go to the next page!'
      hide-tooltip: false # 1.21.5+ only
    back:
      enable: true
      slot: 48
      displayname: '<reset><white><bold>Back'
      material: 'ARROW'
      custom-model-data: 0
      lore:
        - '<reset><gray>Go to the previous page!'
      hide-tooltip: false # 1.21.5+ only
    search:
      enable: true
      slot: 45
      displayname: '<reset><yellow><bold>Search Tags'
      material: 'OAK_SIGN'
      custom-model-data: 0
      lore:
        - '<reset><gray>Search for tags!'
      hide-tooltip: false # 1.21.5+ only
    sort:
      enable: true
      slot: 5
      displayname: '<reset><yellow><bold>Sorting by: <reset><gray>%sort%'
      material: 'ENDER_EYE'
      custom-model-data: 0
      lore:
        - '<reset><dark_gray>Sort'
        - ''
        - '%sort_lore%'
        - ''
        - '<reset><green><underlined>Click to change rarity'
      hide-tooltip: false # 1.21.5+ only
      sorts:
        selected:
          no-filter: '<reset><dark_gray><bold>> <reset><dark_gray>No Filter!'
          popularity: '<reset><dark_gray><bold>> <reset><white><bold>Most Popular'
          recently-used: '<reset><dark_gray><bold>> <reset><white><bold>Recently Used'
          rarity: '<reset><dark_gray><bold>> <reset><white><bold>%rarity%'
        unselected:
          no-filter: '<reset><dark_gray><bold>> <reset><dark_gray>No Filter!'
          popularity: '<reset><dark_gray><bold>> <reset><gray>Most Popular'
          recently-used: '<reset><dark_gray><bold>> <reset><gray>Recently Used'
          rarity: '<reset><dark_gray><bold>> <reset><gray>%rarity%'
        replacements: # for %sort%
          no-filter: '<reset><gray>No Filter'
          popularity: '<reset><gray>Most Popular'
          recently-used: '<reset><gray>Recently Used'
    filter:
      enable: true
      slot: 3
      displayname: '<reset><yellow><bold>Filtering by: <reset><gray>%filter%'
      material: 'HOPPER'
      custom-model-data: 0
      lore:
        - '<reset><dark_gray>Filter'
        - ''
        - '%filter_lore%'
        - ''
        - '<reset><green><underlined>Click to change filter type'
      hide-tooltip: false # 1.21.5+ only
      filters:
        selected:
          your-tags: '<reset><dark_gray><bold>> <reset><white><bold>Your Tags'
          all-tags: '<reset><dark_gray><bold>> <reset><white><bold>All Tags'
          category: '<reset><dark_gray><bold>> %category%'
        unselected:
          your-tags: '<reset><dark_gray><bold>> <reset><gray>Your Tags'
          all-tags: '<reset><dark_gray><bold>> <reset><gray>All Tags'
          category: '<reset><dark_gray><bold>> %category%'
        replacements: # for %filter%
