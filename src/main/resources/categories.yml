############################################################
# +------------------------------------------------------+ #
# |                    Categories                        | #
# +------------------------------------------------------+ #
############################################################

categories-menu-fill-empty: false # set this to true if you want to fill empty slots in main menu of categories.

categories:
  default:
    title: '<bold>Default Tags <reset><dark_gray>(%page%/%max_pages%)' # title of the category gui.
    material: 'NAME_TAG' # item material.
    custom-model-data: 0
    cost-category: false
    glow: false
    id_display: '<reset><gray><bold>Default Tags' # item displayname.
    slot: 11 # slot this item will be in the main menu.
    lore:
      - '<reset><dark_gray><strikethrough>-----------------------------'
      - ''
      - '<reset><gray>Default tags: <reset><gray>%tags_amount%'
      - ''
      - '<reset><dark_gray><strikethrough>-----------------------------'
    filter-labels:
      selected: '<reset><gray><bold>DEFAULT'
      unselected: '<reset><gray>Default'
    permission: 'supremetags.category.default' # permission players will need to open this menu
    permission-see-category: false # if set true and if player doesn't have the permission `supremetags.category.\<category>` they will not see it.
    no-permission-message: '%prefix% <reset><red>You have no permission to open the <reset><gray>Default <reset><red>Category!'
  countries:
    title: '<bold>Country Tags <reset><dark_gray>(%page%/%max_pages%)' # title of the category gui.
    material: 'NAME_TAG' # item material.
    custom-model-data: 0
    cost-category: false
    glow: false
    id_display: '<reset><white><bold>Country Tags' # item displayname.
    slot: 13 # slot this item will be in the main menu.
    lore:
      - '<reset><dark_gray><strikethrough>-----------------------------'
      - ''
      - '<reset><white>Country tags: <reset><gray>%tags_amount%'
      - ''
      - '<reset><dark_gray><strikethrough>-----------------------------'
    filter-labels:
      selected: '<reset><white><bold>COUNTRIES'
      unselected: '<reset><gray>Countries'
    permission: 'supremetags.category.countries' # permission players will need to open this menu
    permission-see-category: false # if set true and if player doesn't have the permission `supremetags.category.\<category>` they will not see it.
    no-permission-message: '%prefix% <reset><red>You have no permission to open the <reset><gray>Holiday <reset><red>Category!'
  holiday:
    title: '<bold>Holiday Tags <reset><dark_gray>(%page%/%max_pages%)' # title of the category gui.
    material: 'NAME_TAG' # item material.
    custom-model-data: 0
    cost-category: false
    glow: false
    id_display: '<reset><red><bold>Holiday Tags' # item displayname.
    slot: 15 # slot this item will be in the main menu.
    lore:
      - '<reset><dark_gray><strikethrough>-----------------------------'
      - ''
      - '<reset><red>Holiday tags: <reset><gray>%tags_amount%'
      - ''
      - '<reset><dark_gray><strikethrough>-----------------------------'
    filter-labels:
      selected: '<reset><white><bold>HOLIDAY'
      unselected: '<reset><gray>Holiday'
    permission: 'supremetags.category.holiday' # permission players will need to open this menu
    permission-see-category: false # if set true and if player doesn't have the permission `supremetags.category.\<category>` they will not see it.
    no-permission-message: '%prefix% <reset><red>You have no permission to open the <reset><gray>Holiday <reset><red>Category!'