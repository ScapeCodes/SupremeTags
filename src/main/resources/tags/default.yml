# |----| VARIANTS EXAMPLES |----|
# ## - Variants are sub tags.
# ## - Variant lore's can be edit in guis.yml under 'gui > tag-variants-menu > item > lore'.
# variants:
#   vipplus_blue:
#     enabled: true
#     tag:
#       - '<reset><green>[VIP<reset><aqua>+<reset><green>]'
#     permission: 'supremetags.tag.vip.blue'
#   vipplus_red:
#     enabled: true
#     tag:
#       - '<reset><green>[VIP<reset><red>+<reset><green>]'
#     permission: 'supremetags.tag.vip.red'
#
# groups: []
# ## groups listed here will gain access to the tag, makes it easier than adding 100's of permissions-
# ## inside the permission plugin.
#
# Economy Option Feature (PER TAG)
# economy:
#   enabled: true/false
#   type: 'VAULT' # Available eco types: [VAULT, PLAYERPOINTS, EXP_LEVELS, EXCELLENTECONOMY-currencyhere]
#   amount: 200

tags:
  santa: # Christmas themed tag, shows in the Xmas category.
    tag:
      - '<reset><dark_gray>[<bold><gradient:#ff3131:#ffffff>Santa</gradient><reset><dark_gray>]'
    permission: supremetags.tag.santa
    groups:
      - 'vip'
      - 'vip+'
    description:
      - '<reset><gray>ho ho hooooooo!'
    custom-placeholders:
      # %custom-placeholder_\<placeholder>%
      # %supremetags_tag_custom-placeholder_\<placeholder>%
      nopermission: '<reset><red>You do not have any permission to use <reset><dark_gray>[<reset><red><bold>Santa<reset><dark_gray>]'
      wheretofind: '<reset><yellow>You find this tag in <reset><yellow><bold>Example Crate<reset><yellow>!'
    category: holiday
    order: 2
    withdrawable: false
    displayname: '<reset><gray>Tag: %tag%'
    custom-model-data: 0
    display-item: NAME_TAG
    variants:
      white-santa:
        enabled: true
        tag:
          - '<reset><white>[<reset><red>Santa<reset><white>]'
        item:
          locked:
            material: 'BARRIER'
            displayname: '<reset><gray>Variant: %tag%'
            custom-model-data: 0
          unlocked:
            material: 'NAME_TAG'
            displayname: '<reset><gray>Variant: %tag%'
            custom-model-data: 0
        permission: supremetags.tag.santa.white
    effects: []
    voucher-item:
      material: NAME_TAG
      displayname: '<reset><dark_gray>[<reset><red><bold>Santa<reset><dark_gray>] <reset><white><bold>Voucher'
      custom-model-data: 0
      glow: true
      lore:
        - '<reset><gray><strikethrough>-----------------------------'
        - '<reset><yellow>Click to equip!'
        - '<reset><gray><strikethrough>-----------------------------'
    rarity: common
    economy:
      enabled: false
      type: VAULT
      amount: 200
